<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Great Auto Parts - Order Form</title>

    <style>
        body {
            font-family: "Times New Roman", serif;
            background-color: white;
            margin: 0;
            padding: 10px;
        }

        .container {
            max-width: 522px;
            margin: auto;
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin-top: 0;
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 10px;
        }
        input,
        textarea {
            width: 100%;
            padding: 12px 10px;
            margin-top: 2px;
            margin-bottom: 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }
        textarea {
            height: 222px;
            resize: vertical;
        }
        button {
            width: 100%;
            padding: 11px;
            background-color: black;
            color: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #333;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Great Auto Parts - Order Form</h1>
        <form>
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName"
                   placeholder="Enter your first name" required>

            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName"
                   placeholder="Enter your last name" required>

            <label for="email">Email:</label>
            <input type="email" id="email"
                   placeholder="Enter your email address" required>

            <label for="phone">Phone number:</label>
            <input type="tel" id="phone"
                   placeholder="Enter your phone number" required>

            <label for="make">Make:</label>
            <input type="text" id="make" placeholder="Make" required>

            <label for="model">Model:</label>
            <input type="text" id="model" placeholder="Model" required>

            <label for="year">Year:</label>
            <input type="number" id="year" placeholder="Year" required>

            <label for="date">Date:</label>
            <input type="date" id="date" required>

            <label for="part">Spare Part:</label>
            <input type="text" id="part"
                   placeholder="Enter the spare part you need" required>

            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity"
                   placeholder="Enter the quantity of the spare part you need"
                   min="1" required>

            <label for="comment">Comment:</label>
            <textarea id="comment"
                      placeholder="Enter your comment"></textarea>

            <button type="submit">Submit</button>
        </form>
    </div>

</body>
</html>
